<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diabetes Prediction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="container">
      <div class="row mb-3 mt-3">
        <h1 style="text-align:center">Diabetes Prediction</h1>
      </div>
      <form>
        <div class="mb-3">
          <label for="Pregnancies" class="form-label">Pregnancies</label>
          <input type="text" class="form-control" id="Pregnancies" name="Pregnancies" placeholder="Enter Pregnancies">
        </div>

        <div class="mb-3">
          <label for="Glucose" class="form-label">Glucose</label>
          <input type="text" class="form-control" id="Glucose" name="Glucose" placeholder="Enter Glucose">
        </div>

        <div class="mb-3">
          <label for="Insulin" class="form-label">Insulin</label>
          <input type="text" class="form-control" id="Insulin" name="Insulin" placeholder="Enter Insulin">
        </div>

        <div class="mb-3">
          <label for="BMI" class="form-label">BMI</label>
          <input type="text" class="form-control" id="BMI" name="BMI" placeholder="Enter BMI">
        </div>

        <div class="mb-3">
          <label for="DiabetesPedigreeFunction" class="form-label">DiabetesPedigreeFunction</label>
          <input type="text" class="form-control" id="DiabetesPedigreeFunction" name="DiabetesPedigreeFunction" placeholder="Enter DiabetesPedigreeFunction">
        </div>

        <div class="mb-3">
          <label for="Age" class="form-label">Age</label>
          <input type="text" class="form-control" id="Age" name="Age" placeholder="Enter Age">
        </div>

        <div class="position-relative row">
          <div class="col position-absolute top-50 start-50">
            <button type="submit" class="btn btn-outline-primary">Predict</button>
          </div>
        </div>

      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
